[tool.ruff]
line-length = 99
target-version = "py38"
select = ["E", "F", "W", "I", "B", "Q"]
ignore = ["E501"]
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.isort]
known-first-party = ["aw_core", "aw_client", "aw_server", "aw_qt", "aw_watcher_afk", "aw_watcher_window", "aw_watcher_input", "aw_notify", "aw_datastore"]

[tool.ruff.mccabe]
max-complexity = 10

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
